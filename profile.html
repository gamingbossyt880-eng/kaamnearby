<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - Kaam Nearby</title>

    <link rel="stylesheet"
          href="style.css">

</head>


<body class="profile-page">


    <!-- =========================================
         NAVBAR
    ========================================== -->

    <header class="profile-header">

        <div class="profile-logo">
            Kaam Nearby
        </div>


        <nav class="profile-nav">

            <a href="jobseeker.html">
                Home
            </a>

            <a href="myapplications.html">
                My Applications
            </a>

            <a href="login.html">
                Logout
            </a>

        </nav>

    </header>



    <!-- =========================================
         PROFILE MAIN
    ========================================== -->

    <main class="profile-main">


        <div class="profile-card">


            <!-- PROFILE HEADER -->

            <div class="profile-card-header">

                <div class="profile-avatar">
                    👤
                </div>

                <h1>
                    My Profile
                </h1>

                <p>
                    Complete your profile to apply for jobs
                </p>

            </div>



            <!-- PROFILE FORM -->

            <form id="profileForm">


                <!-- NAME -->

                <div class="profile-field">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <!-- EMAIL -->

                <div class="profile-field">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Your registered email"
                        readonly
                    >

                </div>



                <!-- PHONE -->

                <div class="profile-field">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>



                <!-- SKILLS -->

                <div class="profile-field">

                    <label for="skills">
                        Skills
                    </label>

                    <input
                        type="text"
                        id="skills"
                        placeholder="Example: Driving, Computer, Sales"
                        required
                    >

                </div>



                <!-- EXPERIENCE -->

                <div class="profile-field">

                    <label for="experience">
                        Experience
                    </label>

                    <input
                        type="text"
                        id="experience"
                        placeholder="Example: 2 years"
                        required
                    >

                </div>



                <!-- LOCATION -->

                <div class="profile-field">

                    <label for="location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter your current location"
                        required
                    >

                </div>



                <!-- SAVE BUTTON -->

                <button
                    type="submit"
                    class="save-profile-btn">

                    Save Profile

                </button>


            </form>



            <!-- MESSAGE -->

            <p
                id="message"
                class="profile-message">
            </p>


        </div>


    </main>



    <script src="profile.js"></script>


</body>

</html>
</html>
