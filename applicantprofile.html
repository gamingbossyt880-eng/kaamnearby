<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Applicant Profile - Kaam Nearby</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

   body {
    background: #f1f5f9;
    margin: 0;
    font-family: Arial, sans-serif;
}

.profile-page {
    max-width: 700px;
    margin: 50px auto;
    padding: 20px;
}

.profile-card {
    background: white;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.10);
}

.profile-header {
    display: flex;
    align-items: center;
    gap: 25px;
    margin-bottom: 30px;
    padding: 25px;
    border-radius: 15px;
    background: #2563eb;
    color: white;
}

.profile-title {
    flex: 1;
}

.profile-title h1 {
    margin: 0 0 8px 0;
    font-size: 32px;
}

.profile-title p {
    margin: 0;
    font-size: 17px;
    color: #dbeafe;
}

#profilePhoto {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    display: none;
    border: 4px solid white;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.20);
}

.profile-info {
    display: grid;
    gap: 15px;
}

.info-box {
    background: #f8fafc;
    padding: 15px;
    border-radius: 10px;
    border-left: 4px solid #2563eb;
}

.info-box strong {
    display: block;
    margin-bottom: 5px;
    color: #1e3a8a;
}

.info-box span {
    color: #111827;
    word-break: break-word;
}

#profileMessage {
    text-align: center;
    margin-top: 20px;
    font-weight: 600;
}

.back-btn {
    display: block;
    width: fit-content;
    margin: 25px auto 0;
    padding: 11px 20px;
    background: #2563eb;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.back-btn:hover {
    background: #1d4ed8;
}

@media (max-width: 600px) {

    .profile-header {
        flex-direction: column;
        text-align: center;
    }

    .profile-title h1 {
        font-size: 26px;
    }

}
    
</head>


<body>


    <div class="profile-page">

        <div class="profile-card">


            <div class="profile-header">

    <img
        id="profilePhoto"
        src=""
        alt="Applicant Profile Photo"
    >

    <div class="profile-title">

        <h1 id="profileName">
            Loading...
        </h1>

        <p>
            Applicant Profile
        </p>

    </div>

</div>

            <div class="profile-info">


                <div class="info-box">

                    <strong>
                        📧 Email
                    </strong>

                    <span id="profileEmail">
                        Loading...
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        📱 Phone
                    </strong>

                    <span id="profilePhone">
                        Loading...
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        🛠️ Skills
                    </strong>

                    <span id="profileSkills">
                        Loading...
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        💼 Experience
                    </strong>

                    <span id="profileExperience">
                        Loading...
                    </span>

                </div>


                <div class="info-box">

                    <strong>
                        📍 Location
                    </strong>

                    <span id="profileLocation">
                        Loading...
                    </span>

                </div>


            </div>


            <p id="profileMessage">
                Loading applicant profile...
            </p>


            <a
                href="employerapplications.html"
                class="back-btn"
            >
                ← Back to Applications
            </a>


        </div>

    </div>


    <script src="applicantprofile.js"></script>

</body>

</html>
