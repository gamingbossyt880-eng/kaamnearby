<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Job - Kaam Nearby</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="logo">
            Kaam Nearby
        </div>

        <nav>

            <a href="employerjobs.html">
                My Jobs
            </a>

            <a href="employer.html">
                Post Job
            </a>

            <a href="login.html">
                Logout
            </a>

        </nav>

    </header>


    <main>

        <div class="register-box">

            <h1>Edit Job</h1>


            <form id="editJobForm">

                <label>
                    Job Title
                </label>

                <input
                    type="text"
                    id="jobTitle"
                    required
                >


                <label>
                    Shop Name
                </label>

                <input
                    type="text"
                    id="shopName"
                    required
                >


                <label>
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    required
                >


                <label>
                    Salary
                </label>

                <input
                    type="text"
                    id="salary"
                    required
                >


                <label>
                    Working Hours
                </label>

                <input
                    type="text"
                    id="workingHours"
                    required
                >


                <label>
                    Description
                </label>

                <textarea
                    id="description"
                    required
                ></textarea>


                <button type="submit">
                    Update Job
                </button>

            </form>


            <p id="message"></p>

        </div>

    </main>


    <script src="editjob.js"></script>

</body>

</html>
